<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="From one secret to native vault addresses">
<title>From one secret to native vault addresses</title>
<rect width="100%" height="100%" fill="#f5f7fc"/>
<text x="50" y="35" fill="#14243b" font-family="DejaVu Sans" font-size="38" font-weight="bold" dominant-baseline="text-before-edge">1  From one secret to native vault addresses</text>
<text x="50" y="96" fill="#54657b" font-family="DejaVu Sans" font-size="24" font-weight="normal" dominant-baseline="text-before-edge">Each network N and vault index i has a separate authority branch.</text>
<rect x="40" y="165" width="685" height="580" rx="20" fill="#e9f6f3" stroke="#91cbbd" stroke-width="2"/>
<rect x="755" y="165" width="805" height="580" rx="20" fill="#edf1fd" stroke="#b3c2ec" stroke-width="2"/>
<text x="65" y="185" fill="#17654f" font-family="DejaVu Sans" font-size="25" font-weight="bold" dominant-baseline="text-before-edge">PRIVATE: WALLET ONLY</text>
<text x="780" y="185" fill="#38528c" font-family="DejaVu Sans" font-size="25" font-weight="bold" dominant-baseline="text-before-edge">PUBLIC: COMMITMENTS AND ADDRESSES</text>
<rect x="65" y="380" width="250" height="155" rx="20" fill="white" stroke="#7eb3a5" stroke-width="2"/>
<text x="71.6640625" y="407" fill="#14243b" font-family="DejaVu Sans" font-size="23" font-weight="bold" dominant-baseline="text-before-edge">Parano1d secret S</text>
<text x="86.9453125" y="463" fill="#54657b" font-family="DejaVu Sans" font-size="22" font-weight="normal" dominant-baseline="text-before-edge">One secret backup</text>
<rect x="405" y="255" width="290" height="140" rx="20" fill="white" stroke="#7eb3a5" stroke-width="2"/>
<text x="485.9453125" y="279" fill="#14243b" font-family="DejaVu Sans" font-size="30" font-weight="bold" dominant-baseline="text-before-edge">s_EVM,i</text>
<text x="450.625" y="333" fill="#14243b" font-family="DejaVu Sans Mono" font-size="22" font-weight="normal" dominant-baseline="text-before-edge">KDF(S, N, i, v)</text>
<rect x="790" y="255" width="300" height="140" rx="20" fill="white" stroke="#9cabd1" stroke-width="2"/>
<text x="873.8671875" y="279" fill="#14243b" font-family="DejaVu Sans" font-size="30" font-weight="bold" dominant-baseline="text-before-edge">C_EVM,i</text>
<text x="850.015625" y="333" fill="#14243b" font-family="DejaVu Sans Mono" font-size="23" font-weight="normal" dominant-baseline="text-before-edge">C = Commit(s)</text>
<polyline points="695,325 790,325" fill="none" stroke="#60738c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="790,325 775.5928463623571,331.9594485457797 775.5928463623571,318.0405514542203" fill="#60738c"/>
<rect x="405" y="520" width="290" height="140" rx="20" fill="white" stroke="#7eb3a5" stroke-width="2"/>
<text x="489.625" y="544" fill="#14243b" font-family="DejaVu Sans" font-size="30" font-weight="bold" dominant-baseline="text-before-edge">s_SOL,i</text>
<text x="450.625" y="598" fill="#14243b" font-family="DejaVu Sans Mono" font-size="22" font-weight="normal" dominant-baseline="text-before-edge">KDF(S, N, i, v)</text>
<rect x="790" y="520" width="300" height="140" rx="20" fill="white" stroke="#9cabd1" stroke-width="2"/>
<text x="877.546875" y="544" fill="#14243b" font-family="DejaVu Sans" font-size="30" font-weight="bold" dominant-baseline="text-before-edge">C_SOL,i</text>
<text x="850.015625" y="598" fill="#14243b" font-family="DejaVu Sans Mono" font-size="23" font-weight="normal" dominant-baseline="text-before-edge">C = Commit(s)</text>
<polyline points="695,590 790,590" fill="none" stroke="#60738c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="790,590 775.5928463623571,596.9594485457797 775.5928463623571,583.0405514542203" fill="#60738c"/>
<polyline points="315,457 360,457 360,325 405,325" fill="none" stroke="#60738c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="405,325 390.5928463623572,331.9594485457797 390.5928463623572,318.0405514542203" fill="#60738c"/>
<polyline points="360,457 360,590 405,590" fill="none" stroke="#60738c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="405,590 390.5928463623572,596.9594485457797 390.5928463623572,583.0405514542203" fill="#60738c"/>
<rect x="1170" y="255" width="355" height="140" rx="20" fill="#fff5df" stroke="#d8bb73" stroke-width="2"/>
<text x="1206.3984375" y="275" fill="#14243b" font-family="DejaVu Sans" font-size="27" font-weight="bold" dominant-baseline="text-before-edge">Parano1d contract</text>
<text x="1300.359375" y="324" fill="#14243b" font-family="DejaVu Sans Mono" font-size="31" font-weight="normal" dominant-baseline="text-before-edge">0x...</text>
<text x="1226.171875" y="370" fill="#14243b" font-family="DejaVu Sans" font-size="19" font-weight="normal" dominant-baseline="text-before-edge">Factory + init code + salt</text>
<rect x="1170" y="520" width="355" height="140" rx="20" fill="#f4eefe" stroke="#b9a1d5" stroke-width="2"/>
<text x="1230.375" y="540" fill="#14243b" font-family="DejaVu Sans" font-size="29" font-weight="bold" dominant-baseline="text-before-edge">Parano1d PDA</text>
<text x="1241.671875" y="590" fill="#14243b" font-family="DejaVu Sans Mono" font-size="25" font-weight="normal" dominant-baseline="text-before-edge">PDA: base58...</text>
<text x="1225.4140625" y="635" fill="#14243b" font-family="DejaVu Sans" font-size="20" font-weight="normal" dominant-baseline="text-before-edge">Program ID + C + seeds</text>
<polyline points="1090,325 1170,325" fill="none" stroke="#60738c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1170,325 1155.5928463623572,331.9594485457797 1155.5928463623572,318.0405514542203" fill="#60738c"/>
<polyline points="1090,590 1170,590" fill="none" stroke="#60738c" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1170,590 1155.5928463623572,596.9594485457797 1155.5928463623572,583.0405514542203" fill="#60738c"/>
<text x="65" y="700" fill="#17654f" font-family="DejaVu Sans" font-size="23" font-weight="normal" dominant-baseline="text-before-edge">Secrets stay inside the wallet.</text>
<text x="780" y="700" fill="#38528c" font-family="DejaVu Sans" font-size="23" font-weight="normal" dominant-baseline="text-before-edge">C is a public authority commitment.</text>
<text x="50" y="783" fill="#14243b" font-family="DejaVu Sans" font-size="27" font-weight="bold" dominant-baseline="text-before-edge">The authority commitment and the native account address are distinct.</text>
<text x="50" y="830" fill="#54657b" font-family="DejaVu Sans" font-size="24" font-weight="normal" dominant-baseline="text-before-edge">Address recovery also uses the public deployment manifest, network, version and index.</text>
</svg>
