<text x="875" y="873" fill="#68408b" font-family="DejaVu Sans" font-size="23" font-weight="normal" dominant-baseline="text-before-edge">Persistent state prevents nonce reset.</text>
<text x="50" y="964" fill="#14243b" font-family="DejaVu Sans" font-size="26" font-weight="bold" dominant-baseline="text-before-edge">Assets stay on their native chains. The Parano1d wallet creates withdrawal proofs.</text>
